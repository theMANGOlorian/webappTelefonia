<div class="contact-container">
  <h1>Contatti</h1>

  <div class="contact-card">
    <h2>Informazioni Azienda</h2>
    <p><strong>Nome:</strong> Centro Estetico</p>
    <p><strong>Email:</strong> info@centroestetico.it</p>
    <p><strong>Telefono:</strong> +39 123 456 7890</p>
    <p><strong>Indirizzo:</strong> Via Roma 123, Roma</p>
  </div>

  <div class="contact-card">
    <h2>Orari di Apertura</h2>
    <p>Lunedì - Venerdì: 09:00 - 19:00</p>
    <p>Sabato: 09:00 - 14:00</p>
    <p>Domenica: Chiuso</p>
  </div>

  <div class="contact-card">
    <h2>Scrivici</h2>
    <form>
      <div class="form-group">
        <label for="name">Nome</label>
        <input type="text" id="name" placeholder="Il tuo nome" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="La tua email" required>
      </div>

      <div class="form-group">
        <label for="message">Messaggio</label>
        <textarea id="message" rows="4" placeholder="Scrivi il tuo messaggio..." required></textarea>
      </div>

      <button type="submit">Invia</button>
    </form>
  </div>
</div>
