version: '3.9'

services:

  db:
    image: postgres
    container_name: postgres-db
    environment:
      POSTGRES_USER: MatDen
      POSTGRES_PASSWORD: MatDen0302!
      POSTGRES_DB: webapp-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  frontend:
    build:
      context: ./
      dockerfile: Dockerfile.frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./
      dockerfile: Dockerfile.backend
    ports:
      - "3000:8080"
    depends_on:
      - db
volumes:
  postgres_data: